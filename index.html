<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E4F45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relatório DAG">
<title>Relatório Mensal DAG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --verde:#2E4F45; --verde-2:#3D6A5D; --verde-claro:#E6EEEB; --verde-tinta:#F3F7F5;
  --cinza:#5F6663; --cinza-claro:#E3E6E4; --fundo:#F4F5F2; --papel:#fff; --tinta:#1F2523;
  --azul:#1D5F7A; --ambar:#B7791F; --ambar-claro:#FDF3E1; --vermelho:#B03A2E; --vermelho-claro:#FBEAE8;
  --ok:#2F7D4F; --ok-claro:#E5F3EA;
  --raio:12px; --sombra:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--tinta);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde)}
.oculto{display:none!important}
/* barra */
.barra{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.barra .marca{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.barra .marca small{font-weight:400;opacity:.75}
.barra .esp{flex:1}
.mesnav{display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:999px}
.mesnav button{background:none;border:0;color:#fff;width:34px;height:34px;font-size:18px;cursor:pointer}
.mesnav span{min-width:128px;text-align:center;font-weight:600;text-transform:capitalize}
.menu{display:flex;gap:4px;flex-wrap:wrap}
.menu button{background:none;border:0;color:#fff;opacity:.85;padding:6px 10px;border-radius:8px;cursor:pointer}
.menu button.ativo,.menu button:hover{background:rgba(255,255,255,.15);opacity:1}
@media (max-width:640px){.barra{position:static}.menu{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}.menu button{flex:0 0 auto}}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 4px} h2{font-size:18px;margin:22px 0 10px} h3{font-size:15px;margin:0}
.sub{color:var(--cinza);margin:0 0 14px}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--cinza-claro);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:38px;text-decoration:none;color:var(--tinta)}
.btn:hover{border-color:#c8cecb}
.btn.prim{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.prim:hover{background:var(--verde-2)}
.btn.perigo{color:var(--vermelho);border-color:#eccac6}
.btn.peq{padding:4px 10px;min-height:30px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* cartões */
.cartao{background:var(--papel);border-radius:var(--raio);box-shadow:var(--sombra);padding:16px;margin-bottom:12px}
.grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.uni{display:flex;flex-direction:column;gap:10px}
.uni .topo{display:flex;align-items:flex-start;gap:10px}
.uni .sigla{font-size:24px;font-weight:800;color:var(--verde);line-height:1}
.uni .nome{color:var(--cinza);font-size:13px}
.barra-prog{height:6px;border-radius:6px;background:var(--cinza-claro);overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--verde-2)}
.etq{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.e-rascunho{background:#EEF0EF;color:var(--cinza)}
.e-submetido{background:#E3EEF5;color:var(--azul)}
.e-validado{background:var(--ok-claro);color:var(--ok)}
.e-devolvido{background:var(--ambar-claro);color:var(--ambar)}
.mini{font-size:13px;color:var(--cinza)}
/* editor */
.cab-ed{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.cab-ed .tit{flex:1;min-width:220px}
.avisos{border-left:4px solid var(--ambar);background:var(--ambar-claro);border-radius:8px;padding:10px 12px;margin:10px 0}
.avisos.ok{border-color:var(--ok);background:var(--ok-claro)}
.avisos ul{margin:6px 0 0;padding-left:18px}
.avisos li{margin:2px 0}
.avisos li.erro{color:var(--vermelho)}
.avisos a{cursor:pointer;text-decoration:underline}
.nota-dev{border-left:4px solid var(--ambar);background:var(--ambar-claro);padding:8px 12px;border-radius:8px;margin:8px 0}
.cap{margin:26px 0 8px;font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--verde);border-bottom:2px solid var(--verde-claro);padding-bottom:4px}
.sec{scroll-margin-top:80px}
.sec .cabsec{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec .cabsec h3{flex:1}
.tipo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--cinza);background:#F0F2F1;border-radius:6px;padding:2px 6px}
.estado-gravar{font-size:12px;color:var(--cinza);min-width:70px;text-align:right}
textarea{width:100%;min-height:110px;border:1px solid var(--cinza-claro);border-radius:10px;padding:10px 12px;resize:vertical;background:#FCFDFC;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:2px solid #9DBFB3;outline-offset:0;border-color:#9DBFB3}
.fixo{background:var(--verde-tinta);border-radius:10px;padding:10px 12px;white-space:pre-wrap;color:#3a4441;font-size:14px}
.fixo small{display:block;color:var(--cinza);margin-top:6px}
.tabwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--cinza-claro);border-radius:10px;margin-top:10px}
table.grid{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{border-bottom:1px solid #EEF0EF;padding:4px 6px;text-align:right;white-space:nowrap}
table.grid th{background:#F6F8F7;font-size:12px;color:var(--cinza);font-weight:700;position:sticky;top:0}
table.grid th:first-child,table.grid td:first-child{text-align:left;white-space:normal;min-width:170px;max-width:320px;position:sticky;left:0;background:#fff;z-index:1}
table.grid th:first-child{background:#F6F8F7;z-index:2}
table.grid th.atual{color:var(--verde);background:var(--verde-claro)}
table.grid td.atual{background:#F7FBF9}
table.grid tr.grupo td{background:#F0F4F2;font-weight:700;color:var(--verde)}
table.grid tr.tot td{font-weight:700;background:#FAFBFA}
table.grid td.calc{color:#3a4441;font-weight:600}
table.grid input{width:100px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
table.grid input:hover{border-color:var(--cinza-claro)}
table.grid td.atual input{border-color:#cfe0d9;background:#fff}
table.grid input.txt{width:110px;text-align:center}
table.grid input.erro{border-color:var(--vermelho);background:var(--vermelho-claro)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.kpi{border:1px solid var(--cinza-claro);border-radius:10px;padding:10px;background:#FCFDFC}
.kpi label{display:block;font-size:12.5px;color:var(--cinza);margin-bottom:4px;min-height:34px}
.kpi input{width:100%;font-size:20px;font-weight:700;color:var(--verde);border:1px solid var(--cinza-claro);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.kpi .ant{font-size:12px;color:var(--cinza);margin-top:4px}
.reg{border:1px solid var(--cinza-claro);border-radius:10px;padding:10px;margin-top:8px;background:#FCFDFC;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;align-items:end;position:relative}
.reg .campo.l2{grid-column:span 2}.reg .campo.l3,.reg .campo.l4,.reg .campo.l5{grid-column:1/-1}
.reg .apagar{position:absolute;top:6px;right:6px}
.campo label{display:block;font-size:12px;color:var(--cinza);margin-bottom:2px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--cinza-claro);border-radius:8px;padding:7px 9px;background:#fff}
.campo textarea{min-height:60px}
details.ant{margin-top:10px}
details.ant summary{cursor:pointer;color:var(--cinza);font-size:13px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.foto{position:relative;width:200px;border:1px solid var(--cinza-claro);border-radius:10px;overflow:hidden;background:#fff}
.foto img{width:100%;height:130px;object-fit:cover;display:block;background:#eee}
.foto .meta{padding:6px;display:flex;flex-direction:column;gap:4px}
.foto .meta select,.foto .meta input{width:100%;border:1px solid var(--cinza-claro);border-radius:6px;padding:4px 6px;font-size:12.5px;background:#fff}
.foto>button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:6px;width:24px;height:24px;cursor:pointer}
.ferr{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vazio{color:var(--cinza);font-style:italic;font-size:14px}
/* formulários */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.form .inteira{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.cores{display:flex;flex-wrap:wrap;gap:8px}
.fotos-uni{display:flex;flex-wrap:wrap;gap:14px}.foto-uni{display:flex;gap:10px;align-items:flex-start;min-width:260px;flex:1}.foto-uni .thumb{width:120px;height:70px;border-radius:6px;overflow:hidden;background:#e5e9e7;flex:none}.foto-uni .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cor{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border:1px solid #d5dcd9;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:12px;color:#444}
.cor.sel{border:2px solid #222;padding:5px 7px;font-weight:600}
.amostra{display:flex;border-radius:4px;overflow:hidden}.amostra i{width:22px;height:22px;display:block}
.linhas-ed .lin{display:grid;grid-template-columns:1fr 110px 90px 120px auto;gap:6px;align-items:center;margin-bottom:6px}
.linhas-ed .lin input,.linhas-ed .lin select{border:1px solid var(--cinza-claro);border-radius:8px;padding:6px 8px;width:100%;background:#fff}
.linhas-ed .lin .bts{display:flex;gap:2px}
.linhas-ed .lin .bts button{border:1px solid var(--cinza-claro);background:#fff;border-radius:6px;width:28px;height:30px;cursor:pointer}
@media (max-width:640px){.linhas-ed .lin{grid-template-columns:1fr 1fr}.linhas-ed .lin .bts{grid-column:1/-1}}
.lista-sec{display:flex;flex-direction:column;gap:6px}
.lista-sec .item{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--cinza-claro);border-radius:10px;padding:8px 10px}
.lista-sec .item.inativo{opacity:.5}
.lista-sec .item .t{flex:1;min-width:0}
.lista-sec .item .t small{display:block;color:var(--cinza)}
table.simples{width:100%;border-collapse:collapse;font-size:14px}
table.simples td,table.simples th{padding:8px;border-bottom:1px solid var(--cinza-claro);text-align:left;vertical-align:middle}
table.simples select{border:1px solid var(--cinza-claro);border-radius:8px;padding:6px;background:#fff}
/* login */
.login{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,var(--verde) 0 38%,var(--fundo) 38%)}
.login .caixa{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:28px;width:100%;max-width:380px}
.login h1{color:var(--verde);margin:0 0 4px}
.login .campo{margin-top:12px}
.login .btn{width:100%;margin-top:16px}
.login .alt{text-align:center;margin-top:12px;font-size:14px}
.msg-erro{color:var(--vermelho);font-size:14px;margin-top:10px}
/* modal + toast */
.fundo-modal{position:fixed;inset:0;background:rgba(20,30,27,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.fundo-modal{align-items:center;padding:24px}}
.modal{background:#fff;width:100%;max-width:720px;max-height:92dvh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;overflow:hidden}
@media(min-width:700px){.modal{border-radius:16px}}
.modal header{padding:14px 18px;border-bottom:1px solid var(--cinza-claro);font-weight:700;font-size:16px}
.modal .corpo{padding:16px 18px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal footer{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--cinza-claro);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1F2523;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;font-size:14px}
.toast.erro{background:var(--vermelho)}
.carregar{padding:40px;text-align:center;color:var(--cinza)}
.indice-ed{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 -16px;padding-left:16px;scrollbar-width:none}
.indice-ed a{flex:0 0 auto;font-size:12.5px;background:#fff;border:1px solid var(--cinza-claro);border-radius:999px;padding:4px 10px;text-decoration:none;color:var(--tinta);cursor:pointer;white-space:nowrap}
.indice-ed a.falta{border-color:#efd3a6;background:var(--ambar-claro)}
</style>
</head>

function aplicarEdicao(s, corpo, novo) {

}

function preencherExemplo(d) {

  const num = (k, m, f) => { const b = 5 + h(k) % 60; const v = b + ((h(k) + m * 17) % 25); return f === 'eur' ? v * 1375.5 : f === 'pct' ? (v % 100) + 0.5 : f === 'dec1' ? v + 0.5 : v; };
  const set = (sid, k, m, n, t) => { if (!d.V.has(`${sid}|${k}|${d.ano}|${m}`)) d.V.set(`${sid}|${k}|${d.ano}|${m}`, { seccao_id: sid, chave: k, ano: d.ano, mes: m, num: n, txt: t }); };
  d.secs.forEach(sec => {
    const cfg = sec.config || {};
    if (sec.tipo === 'quadro') colunasQuadro(cfg, d.mes).filter(m => m <= d.mes).forEach(m => (cfg.linhas || []).filter(l => !l.g && !l.calc).forEach(l => { const f = fmtLinha(cfg, l); if (f === 'txt') set(sec.id, l.k, m, null, `0${Math.min(9, 1 + h(l.k) % 9)}/${String(m || 12).padStart(2, '0')}/${d.ano}`); else { const ant = gv(d, sec.id, l.k, d.ano, m - 1)?.num; set(sec.id, l.k, m, ant != null && m > 0 ? Math.round(ant * (1 + ((h(l.k) + m) % 3) * 0.04) * 100) / 100 : num(l.k, m, f)); } }));
    if (sec.tipo === 'destaques') { const [pa, pm] = mesAnt(d.ano, d.mes); (cfg.cartoes || []).filter(c => !c.auto).forEach(c => { const ant = gv(d, sec.id, c.k, pa, pm)?.num; set(sec.id, c.k, d.mes, ant != null ? Math.round(ant * (1 + (h(c.k) % 3) * 0.05)) : num(c.k, d.mes, c.fmt)); if (pa === d.ano) set(sec.id, c.k, pm, num(c.k, pm, c.fmt)); }); }
    if (cfg.reparticao && !repart(d, sec).length) ['Exemplo A', 'Exemplo B', 'Exemplo C'].forEach((it, i) => d.regs.push({ id: 'ex' + sec.id + i, seccao_id: sec.id, ano: d.ano, mes: d.mes, ordem: i, dados: { item: it, n: 30 - i * 9 } }));
    if (sec.tipo === 'lista' && !registosVisiveis(d, sec).length) [1, 2].forEach(i => d.regs.push({ id: 'exl' + sec.id + i, seccao_id: sec.id, ano: d.ano, mes: d.mes, ordem: i, dados: Object.fromEntries((cfg.colunas || []).map(c => [c.k, c.tipo === 'data' ? `${d.ano}-${String(d.mes).padStart(2, '0')}-1${i}` : ['int', 'dec', 'eur'].includes(c.tipo) ? i * 125 : `${c.r} (exemplo ${i})`])) }));
    if (cfg.destaque && !destaquesMes(d, sec).length) d.regs.push({ id: 'exd' + sec.id, seccao_id: sec.id, ano: d.ano, mes: d.mes, ordem: 0, dados: { titulo: 'Título do destaque (exemplo)', texto: 'Texto de exemplo do destaque do mês. Aqui aparece a descrição da iniciativa, com as entidades envolvidas e os principais resultados.' } });
    if (['foto_topo', 'foto_esq'].includes(cfg.layout) && !d.anex.some(a => a.seccao_id === sec.id && !a.chave)) d.anex.push({ id: 'exf' + sec.id, seccao_id: sec.id, chave: null, caminho: 'exemplo.jpg', exemplo: true, legenda: 'Fotografia de exemplo', nome: 'exemplo.jpg' });
    const ck = `${sec.id}|${d.ano}|${d.mes}`;
    if (!cfg.fixo && !cfg.destaque && !(d.C.get(ck) || '').trim()) d.C.set(ck, gerarTexto(d, sec) || (sec.tipo === 'texto' ? 'Texto de exemplo. Aqui aparece o texto escrito pela unidade para este mês, descrevendo as atividades realizadas, os procedimentos desenvolvidos e os resultados alcançados.' : ''));
  });
}
async function mostrarPDF(bytes, titulo) {

      corpo.appendChild(c); await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  } catch (e) { console.error(e); corpo.innerHTML = `<p>Não foi possível desenhar a pré-visualização aqui (${esc(erroMsg(e))}). Use "Descarregar PDF".</p>`; }

function cortarImagem(src, w, h, q = 0.8) {
  return new Promise(res => {

      const k = Math.max(w / img.width, h / img.height), sw = w / k, sh = h / k;
      ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h); res(c.toDataURL('image/jpeg', q));
    }; img.onerror = () => res(null); img.src = src;
  });
}

  return null;
}

    const nome = `${uid ? 'Relatório ' + u.sigla : 'Relatório Mensal de Atividades DAG'} — ${cap1(nomeMes(S.mes))} ${S.ano}`;
    await dados(sb.from('arquivo').insert({ unidade_id: uid || null, ano: S.ano, mes: S.mes, nome, caminho, tamanho: bytes.length, versao }));
    fundo.remove(); toast(`Arquivado: ${nome}${versao > 1 ? ' (versão ' + versao + ')' : ''}`); return true;
  } catch (e) { console.error(e); fundo.remove(); toast('Não foi possível arquivar: ' + erroMsg(e), true); return false; }
}
async function abrirArquivo(caminho) {
  const { data } = await sb.storage.from('arquivo').createSignedUrl(caminho, 600, { download: true });
  if (data?.signedUrl) window.open(data.signedUrl, '_blank'); else toast('Não foi possível abrir o ficheiro.', true);
}
async function vistaArquivo(main) {
  const todosR = await dados(sb.from('arquivo').select('*').eq('ano', S.ano).order('mes', { ascending: false }).order('versao', { ascending: false }));
  const regs = todosR.filter(r => (r.tipo || 'mensal') === 'mensal'), anuais = todosR.filter(r => r.tipo === 'anual');
  const mf = mesFimAnual(S.ano);
  const meses = [...new Set(regs.map(r => r.mes))];
  const ordemU = id => id ? (S.unidades.find(u => u.id === id)?.ordem ?? 99) : -1;
  main.innerHTML = `<div class="cab-ed"><div class="tit"><h1>Arquivo ${S.ano}</h1><p class="sub">Os relatórios ficam guardados aqui quando são validados; o relatório geral do DAG quando o mês é fechado no Painel. Use as setas do mês, no topo, para mudar de ano.</p></div></div>
    <div class="cartao"><h2 style="margin:0 0 6px">Relatório anual ${S.ano}</h2>
      <p class="mini" style="margin:0 0 10px">Consolida os dados de ${periodoAnual(S.ano, mf)}: quadros mês a mês com total ou média, gráficos de evolução, síntese automática e destaques do ano.${mf < 12 ? ' Para outro período, escolha o último mês nas setas do topo.' : ''}</p>
      <div class="acoes"><select id="anAmb" class="btn"><option value="DAG">DAG — todas as unidades</option>${S.unidades.filter(u => u.id !== 'DAG' && u.ativo !== false).map(u => `<option value="${u.id}">${esc(u.sigla)} · ${esc(u.nome)}</option>`).join('')}</select>
      <button class="btn" id="anGer">Gerar PDF</button>${gestor() ? '<button class="btn prim" id="anArq">Gerar e arquivar</button>' : ''}</div>
      ${anuais.length ? `<table class="simples" style="margin-top:10px">${anuais.map(r => `<tr><td>${esc(r.nome)}${r.versao > 1 ? ` <span class="mini">(versão ${r.versao})</span>` : ''}<br><span class="mini">Arquivado a ${new Date(r.criado_em).toLocaleDateString('pt-PT')}</span></td><td style="text-align:right"><button class="btn peq" data-cam="${esc(r.caminho)}">Descarregar</button></td></tr>`).join('')}</table>` : ''}
    </div>
    <h2>Relatórios mensais</h2>
    ${meses.length ? meses.map(m => {
      const doMes = regs.filter(r => r.mes === m); const ids = [...new Set(doMes.map(r => r.unidade_id || ''))].sort((a, b) => ordemU(a) - ordemU(b));
      return `<div class="cartao"><h2 style="margin:0 0 8px;text-transform:capitalize">${nomeMes(m)} ${S.ano}</h2><table class="simples">${ids.map(id => {
        const vs = doMes.filter(r => (r.unidade_id || '') === id), r = vs[0];
        return `<tr><td>${id ? '' : '<b>'}${esc(r.nome)}${id ? '' : '</b>'}<br><span class="mini">Arquivado a ${new Date(r.criado_em).toLocaleDateString('pt-PT')}${r.versao > 1 ? ' · versão ' + r.versao : ''}${vs.length > 1 ? ' · versões anteriores: ' + vs.slice(1).map(v => `<a data-cam="${esc(v.caminho)}">v${v.versao}</a>`).join(' ') : ''}</span></td>
          <td style="text-align:right"><button class="btn peq ${id ? '' : 'prim'}" data-cam="${esc(r.caminho)}">Descarregar</button></td></tr>`;
      }).join('')}</table></div>`;
    }).join('') : `<div class="cartao vazio">Ainda não há relatórios arquivados em ${S.ano}.</div>`}`;
  $$('[data-cam]', main).forEach(b => b.onclick = () => abrirArquivo(b.dataset.cam));
  $('#anGer').onclick = () => relatorioAnual($('#anAmb').value, false);
  if ($('#anArq')) $('#anArq').onclick = () => relatorioAnual($('#anAmb').value, true);
}

if (!window.__SEM_ARRANQUE) iniciar();
</script>
</body>
</html>
